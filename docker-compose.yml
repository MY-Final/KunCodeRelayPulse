services:
  pulse:
    image: "myfinal12/kuncoderelaypulse:${PULSE_VERSION:-latest}"
    container_name: kuncode-relay-pulse
    restart: unless-stopped
    ports:
      - "${PULSE_PORT:-6789}:18080"
    command: ["-config", "/app/config/config.yaml"]
    volumes:
      - ./config:/app/config
      - ./channels.d:/app/channels.d
      - ./proxies.d:/app/proxies.d
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:18080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
