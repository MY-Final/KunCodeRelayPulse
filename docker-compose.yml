services:
  pulse:
    image: myfinal12/kuncoderelaypulse:latest
    container_name: kuncode-relay-pulse
    restart: unless-stopped
    ports:
      - "6789:18080"
    command: ["-config", "/app/config/config.yaml"]
    volumes:
      - ./config:/app/config
      - ./channels.d:/app/config/channels.d
      - ./proxies.d:/app/config/proxies.d
      - ./templates:/app/config/templates:ro
      - ./data:/app/config/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:18080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
